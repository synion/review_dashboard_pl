# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# Kolejka „czeka na Twoje review" ma się odświeżać bez wchodzenia na stronę — inaczej
# PR do recenzji widać dopiero, gdy się o niego zapyta. Interwał trzyma się
# GithubInbox::STALE_AFTER, a margines na spóźnienie tiku daje GithubInbox::TICK_GRACE.
# Zadanie jest zarejestrowane zawsze, ale odpytuje GitHuba tylko przy INBOX_SCHEDULE=1
# (patrz RefreshAllInboxesJob.enabled?) — świeżo pobrany dashboard nie rusza sieci
# bez zgody właściciela maszyny, a włączenie to restart, nie edycja tego pliku.
# Środowisko testowe świadomie bez wpisu: harmonogram w testach dorzucałby joby
# w tle i zamazywał asercje o kolejkowaniu.
default: &default
  refresh_review_inbox:
    class: RefreshAllInboxesJob
    schedule: every 10 minutes

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
